<!doctype html>

<title>Navarasa Saint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>/* embedded in the portfolio's handheld: ?embed (the light mood skies, UI clear of the pillars and the parked cassette),
   &bg (attract view only: the saint, no UI), &inset=<px> (pillar inner edge from the bay edge) */
(() => { const Q = new URLSearchParams(location.search), h = document.documentElement;
  if (Q.has('embed')) { h.classList.add('embed'); h.dataset.theme = 'light'; } if (Q.has('bg')) h.classList.add('bgonly');
  h.style.setProperty('--ix', (parseFloat(Q.get('inset')) || 0) + 'px'); })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;600&display=swap">
<style>
  /* Layout: full-bleed sky; title and tally on top, the saint's rig in the middle, nine rasa chips along the bottom. */
  :root {
    --ink: #2A2140;
    --muted: #6B6283;
    --saffron: #D9650F;
    --glass: rgba(255, 255, 255, 0.6);
    --line: rgba(42, 33, 64, 0.16);
    --night: #15111F;
    --mix: 100%;
    --mood: #D9650F;
    --display: "Baloo 2", "Kohinoor Devanagari", "Noto Sans Devanagari", system-ui, sans-serif;
    --body: "Mukta", "Kohinoor Devanagari", "Noto Sans Devanagari", system-ui, sans-serif;
    --sky-a: #E6E0F5;
    --sky-b: #FBF4E8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #F2ECFF; --muted: #B5ACCB; --saffron: #FF9A4D;
      --glass: rgba(30, 24, 46, 0.64); --line: rgba(242, 236, 255, 0.18);
      --mix: 30%; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #F2ECFF; --muted: #B5ACCB; --saffron: #FF9A4D;
    --glass: rgba(30, 24, 46, 0.64); --line: rgba(242, 236, 255, 0.18);
    --mix: 30%; color-scheme: dark;
  }

  html, body { height: 100%; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
  }
  .stage {
    position: relative;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg,
      color-mix(in oklab, var(--sky-a) var(--mix), var(--night)),
      color-mix(in oklab, var(--sky-b) var(--mix), var(--night)));
  }
  .ui {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px;
  }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: grid; line-height: 1; }
  .brand .deva { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--saffron); letter-spacing: 0.02em; }
  .brand h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 800; font-size: clamp(22px, 4vw, 30px); letter-spacing: -0.01em; }
  .tally {
    margin: 0; padding: 6px 12px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line);
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }

  .mood {
    align-self: center; text-align: center; margin-top: 6px;
    display: grid; gap: 0; line-height: 1;
  }
  .mood .deva { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 7vw, 52px); color: var(--mood); }
  .mood .name { margin-top: 6px; font-size: 16px; font-weight: 600; letter-spacing: 0.04em; }
  .mood .name span { color: var(--muted); font-weight: 400; }
  .mood.swap { animation: moodIn 520ms cubic-bezier(.2, .9, .3, 1.3); }
  @keyframes moodIn { from { transform: translateY(-8px) scale(0.92); opacity: 0.2; } to { transform: none; opacity: 1; } }

  /* The stage button: a focusable region that holds the SVG rig */
  .scene {
    flex: 1; min-height: 0; position: relative; outline: none; border-radius: 18px;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .scene:focus-visible { box-shadow: 0 0 0 3px var(--saffron); }
  .scene svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #cloud, #saint, #cloudFront { cursor: pointer; }
  .skin { fill: var(--skin); }
  .skinS { fill: var(--skinShade); }

  .hint {
    align-self: center; margin: 0 0 10px; padding: 6px 14px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line); font-size: 15px; font-weight: 600;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    animation: nudge 2.4s ease-in-out infinite;
  }
  @keyframes nudge { 50% { transform: translateY(-4px); } }
  .toastSlot { position: relative; height: 0; display: flex; justify-content: center; }
  .toast {
    position: absolute; bottom: 8px; margin: 0; padding: 8px 16px; border-radius: 999px; white-space: nowrap;
    background: var(--saffron); color: #fff; font-weight: 600; font-size: 15px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22); animation: moodIn 520ms cubic-bezier(.2, .9, .3, 1.3);
  }

  .rasas { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 960px; width: 100%; align-self: center; }
  .chip {
    appearance: none; border: 1px solid var(--line); background: var(--glass); color: var(--ink);
    border-radius: 14px; padding: 8px 4px 7px; min-width: 0; min-height: 46px;
    flex: 1 1 0; max-width: 104px;
    display: grid; justify-items: center; align-content: center; gap: 2px;
    font: inherit; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform 160ms ease, border-color 200ms ease;
  }
  .chip:hover:not(:disabled) { transform: translateY(-2px); }
  .chip:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in oklab, var(--c) 25%, transparent); }
  .chip .d { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.1; }
  .chip .e { font-size: 12px; color: var(--muted); line-height: 1; }
  .chip:disabled { cursor: default; border-style: dashed; }
  .chip:disabled .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .chip:disabled .d, .chip:disabled .e { color: var(--muted); opacity: 0.7; }
  .chip[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
  .chip.new { animation: found 700ms cubic-bezier(.2, .9, .3, 1.4); }
  @keyframes found { 0% { transform: scale(0.7); } 60% { transform: scale(1.12); } 100% { transform: none; } }

  @media (max-width: 600px) {
    .rasas { gap: 5px; }
    .chip { flex: 0 0 calc((100% - 20px) / 5); max-width: none; }
    .chip .e { display: none; }
  }
  @media (max-height: 520px) {
    .hint { display: none; }
    .mood { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 62px; text-align: left; align-self: auto; }
    .mood .deva { font-size: 30px; }
    .mood .name { font-size: 14px; }
    .chip { min-height: 38px; padding: 5px 2px; }
    .chip .e, .chip .dot { display: none; }
    .rasas { flex-wrap: nowrap; }
    .chip { flex: 1 1 0; max-width: 104px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint, .mood.swap, .chip.new, .toast { animation: none; }
  }
  /* embedded in the portfolio (see the head script) */
  html.embed .ui { padding-left: calc(var(--ix, 0px) + 18px); padding-right: calc(var(--ix, 0px) + 18px); padding-top: 92px; }
  html.bgonly body, html.bgonly .stage { background: transparent; }   /* attract view: the handheld's Navarasa world shows behind the saint */
  html.bgonly .top, html.bgonly .mood, html.bgonly .hint, html.bgonly .toastSlot, html.bgonly .rasas { visibility: hidden; }
</style>

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

const PRE = {};
for (const id in PRESETS) {

let target = "idle";
const rgb = (a, m = 1) => `rgb(${a.map(v => Math.round(clamp(v * m, 0, 255))).join(",")})`;
function tween(dt) {
  const k = 1 - Math.exp(-dt * (reduce ? 22 : 6));
  const T = PRE[target];
  for (const key in S) {
    const a = S[key], b = T[key];
    if (Array.isArray(a)) for (let i = 0; i < 3; i++) a[i] += (b[i] - a[i]) * k;

}

/* ----------------------------- building the rig ----------------------------- */
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent?.appendChild(e);
  return e;
};
const html = (parent, markup) => { parent.innerHTML = markup; return parent; };

// Eyes: white, iris, pupil, catchlight, lower lid, upper lid (right eye is the left one mirrored)
function eyeMarkup(s) {
  const cx = 3 * s;
  return `
  <g clip-path="url(#cpEye)">
    <ellipse class="white" rx="16" ry="13" fill="#FFFDF7"/>
    <g class="gaze">
      <g class="irisG"><circle r="8.8" fill="#7B4A2A"/><circle cy="3.2" r="5.2" fill="#A8703F" opacity=".75"/><circle r="8.8" fill="none" stroke="#3E2314" stroke-width="1.7"/></g>

    </g>
  </g>

    <path class="upperLine" fill="none" stroke="#2A1B2E" stroke-width="3.4" stroke-linecap="round"/>

}
const eyes = [["eyeL", 176, 1], ["eyeR", 224, -1]].map(([id, x, s]) => {
  const g = $(id);
  g.setAttribute("transform", s > 0 ? `translate(${x} 128)` : `translate(${x} 128) scale(-1 1)`);
  g.innerHTML = eyeMarkup(s);
  const q = c => g.querySelector("." + c);
  return { s, gaze: q("gaze"), iris: q("irisG"), pupil: q("pupil"), catchL: q("catch"),
           up: q("upperLid"), low: q("lowerLid"), upL: q("upperLine"), lowL: q("lowerLine") };
});
const brows = [["browL", "browLp", 176, 1], ["browR", "browRp", 224, -1]].map(([gid, pid, x, s]) => ({ g: $(gid), p: $(pid), x, s }));

// Chakra orbs: purple, blue, green, yellow, orange, red, magenta (left to right)
const ORB_COLORS = ["#8E4FD8", "#3E73E0", "#34B567", "#F5C928", "#F28A1E", "#E0372F", "#D93AA6"];
const orbs = ORB_COLORS.map((c, i) => {

  g.innerHTML = `<circle class="glow" r="20" fill="${c}" opacity=".28"/><circle r="11.5" fill="${c}" stroke="#2A1B2E" stroke-width="2.4"/><ellipse cx="-3.8" cy="-4.2" rx="4.2" ry="2.6" fill="#fff" opacity=".7" transform="rotate(-35 -3.8 -4.2)"/>`;

});

// Cloud: lumps drawn twice (outline, then fill) so the silhouette has one clean outline
const CLOUD = [
  [72, 376, 30], [116, 372, 34], [161, 374, 36], [206, 375, 37], [251, 374, 36], [295, 372, 34], [338, 376, 30],
  [88, 400, 28], [135, 406, 30], [182, 410, 30], [230, 410, 30], [277, 406, 30], [322, 400, 28],
];
const FRONT = [[112, 374, 24], [152, 374, 25], [196, 374, 26], [240, 374, 25], [284, 374, 24]];
const lumps = (list, grow) => list.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + grow}"/>`).join("");
html($("cloudBack"), `<g fill="#2A2038">${lumps(CLOUD, 2.6)}</g><g fill="url(#gCloud)">${lumps(CLOUD, 0)}</g>
  <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity=".55">
    <path d="M52,366 q6,-14 20,-17"/><path d="M96,358 q10,-12 26,-12"/><path d="M142,356 q10,-10 24,-10"/><path d="M184,356 q10,-10 26,-9"/><path d="M232,357 q10,-9 24,-8"/><path d="M276,356 q8,-10 22,-10"/><path d="M322,364 q6,-10 18,-12"/>
  </g>`);
const half = r => `M${r[0] - r[2]},${r[1]}A${r[2]},${r[2]} 0 0 1 ${r[0] + r[2]},${r[1]}`;
html($("cloudFront"), `<g fill="none" stroke="#2A2038" stroke-width="5.2">${FRONT.map(r => `<path d="${half(r)}"/>`).join("")}</g><g fill="url(#gCloud)">${FRONT.map(r => `<path d="${half(r)}Z"/>`).join("")}</g>
  <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" opacity=".5"><path d="M96,368 q8,-12 22,-12"/><path d="M180,372 q8,-12 22,-12"/><path d="M268,368 q8,-10 20,-10"/></g>`);

// Limbs (the saint's arms and the cloud's arms share one FK rig)
function limbMarkup(id, o) {
  const stripes = o.stripes ? `<g class="stripes" stroke="#FFF8EC" stroke-width="3.4" stroke-linecap="round"><path/><path/><path/></g>` : "";
  return `<g id="${id}">

html($("arms"), limbMarkup("armL", { w: 22, fill: "var(--skin)", stripes: true }) + limbMarkup("armR", { w: 22, fill: "var(--skin)", stripes: true }));
html($("cloudArms"), limbMarkup("cArmL", { w: 34, fill: "var(--cmid)" }) + limbMarkup("cArmR", { w: 34, fill: "var(--cmid)" }));
const limb = id => { const g = $(id), q = c => g.querySelector("." + c);
  return { g, o: q("o"), s: q("s"), bo: q("bo"), bs: q("bs"), bc: q("bc"), hand: q("hand"), ho: q("ho"), hs: q("hs"), hf: q("hf"), stripes: [...g.querySelectorAll(".stripes path")] }; };
const armL = limb("armL"), armR = limb("armR"), cArmL = limb("cArmL"), cArmR = limb("cArmR");

function setLimb(L, sx, sy, side, a1, a2, l1, l2, bic, handR) {
  const r1 = a1 * Math.PI / 180, r2 = a2 * Math.PI / 180;
  const ux = side * Math.cos(r1), uy = Math.sin(r1);
  const ex = sx + ux * l1, ey = sy + uy * l1;
  const hx = ex + side * Math.cos(r2) * l2, hy = ey + Math.sin(r2) * l2;
  const d = `M${n2(sx)},${n2(sy)}L${n2(ex)},${n2(ey)}L${n2(hx)},${n2(hy)}`;
  L.o.setAttribute("d", d); L.s.setAttribute("d", d);
  L.ho.setAttribute("cx", n2(hx)); L.ho.setAttribute("cy", n2(hy)); L.ho.setAttribute("r", n2(handR + 2.6));
  L.hs.setAttribute("cx", n2(hx)); L.hs.setAttribute("cy", n2(hy)); L.hs.setAttribute("r", n2(handR));
  L.hf.setAttribute("d", `M${n2(hx - 4)},${n2(hy - 4)}q4,5 8,0M${n2(hx - 4)},${n2(hy + 1)}q4,5 8,0`);
  L.hf.style.opacity = L.stripes.length ? clamp(bic, 0, 1) * 0.55 : 0;
  // bicep bulge, drawn as a bump on the upper side of the upper arm
  const ang = Math.atan2(uy, ux) * 180 / Math.PI;
  const mx = sx + ux * l1 * 0.55 + side * uy * 9 * bic, my = sy + uy * l1 * 0.55 - side * ux * 9 * bic;
  for (const [e, grow] of [[L.bs, 0], [L.bo, 2.6]]) {
    e.setAttribute("rx", n2(Math.max(0, 15 * bic + grow * (bic > 0.02 ? 1 : 0))));
    e.setAttribute("ry", n2(Math.max(0, 11 * bic + grow * (bic > 0.02 ? 1 : 0))));
    e.setAttribute("cx", n2(mx)); e.setAttribute("cy", n2(my));
    e.setAttribute("transform", `rotate(${n2(ang)} ${n2(mx)} ${n2(my)})`);
  }
  L.bc.setAttribute("d", bic > 0.02 ? `M${n2(mx - 6)},${n2(my + 7 * bic)}q6,3 12,0` : "");
  L.bc.setAttribute("transform", `rotate(${n2(ang)} ${n2(mx)} ${n2(my)})`);
  if (L.stripes.length) {
    const len = Math.hypot(ex - sx, ey - sy) || 1, px = -(ey - sy) / len, py = (ex - sx) / len;
    [0.5, 0.64, 0.78].forEach((t, i) => {
      const cx = sx + (ex - sx) * t, cy = sy + (ey - sy) * t, h = i === 1 ? 9.6 : 8.6;
      L.stripes[i].setAttribute("d", `M${n2(cx - px * h)},${n2(cy - py * h)}L${n2(cx + px * h)},${n2(cy + py * h)}`);
    });
  }
}

// Garland of jasmine and roses, draped from the shoulders
(() => {
  const P0 = [146, 226], C = [200, 314], P2 = [254, 226], N = 13;
  const at = t => [(1 - t) ** 2 * P0[0] + 2 * (1 - t) * t * C[0] + t * t * P2[0], (1 - t) ** 2 * P0[1] + 2 * (1 - t) * t * C[1] + t * t * P2[1]];
  let m = `<path d="M${P0}Q${C} ${P2}" fill="none" stroke="#2A1B2E" stroke-width="8.4" stroke-linecap="round"/><path d="M${P0}Q${C} ${P2}" fill="none" stroke="#3E8A3E" stroke-width="5" stroke-linecap="round"/>`;
  for (let i = 0; i <= N; i++) {
    const [x, y] = at(i / N);
    if (i % 2 === 0) {
      let petals = "";
      for (let k = 0; k < 5; k++) petals += `<ellipse cx="0" cy="-4.4" rx="2.9" ry="4.2" fill="#FFFDF4" stroke="#2A1B2E" stroke-width="1.3" transform="rotate(${k * 72})"/>`;

function setMood(id) {

    for (const p of smokePuffs) {
      const u = (t * p.sp * run + p.ph) % 1;
      p.e.setAttribute("cx", n2(p.x + 14 * Math.sin(t * 0.9 + p.ph * 20))); p.e.setAttribute("cy", n2(400 - u * 230));
      p.e.setAttribute("r", n2(9 + u * 20)); p.e.setAttribute("opacity", n2(0.7 * fade(u, 0.12, 0.7)));
    }
    for (const c of curls) {
      const u = (t * 0.14 * run + c.ph) % 1;
      c.e.setAttribute("transform", `translate(${n2(c.x + 8 * Math.sin(t * 1.3 + c.ph * 9))} ${n2(380 - u * 180)})`); c.e.setAttribute("opacity", n2(0.85 * fade(u, 0.1, 0.7)));
    }
  }
  if (show("boltFx", S.storm)) {
    for (const b of bolts) {
      const f = Math.sin(t * 3.1 + b.i * 2.3) * Math.sin(t * 1.3 + b.i);
      const on = reduce ? b.i !== 1 : f > 0.28;
      b.e.setAttribute("transform", `translate(${b.x} 424) scale(${b.i === 1 ? 1.12 : 0.92})`);
      b.e.setAttribute("opacity", on ? 1 : 0);
    }
  }
  if (show("rainFx", S.rain)) {
    for (const d of rain) {
      const u = (t * d.sp * run + d.ph) % 1;
      d.e.setAttribute("transform", `translate(${n2(d.x - u * 14)} ${n2(424 + u * 74)})`);
      d.e.setAttribute("opacity", n2(0.9 * fade(u, 0.08, 0.82)));
    }
  }
  if (show("sparkFx", S.spark)) {
    for (const s of sparks) {
      const tw = reduce ? 0.8 : Math.max(0, Math.sin(t * 2.4 + s.ph)) ** 2;
      s.g.setAttribute("transform", `translate(${s.x} ${s.y}) rotate(${n2(t * 20 * run + s.ph * 40)}) scale(${n2((0.25 + 0.95 * tw) * s.sz)})`);
    }
  }
  if (show("leafFx", S.wind)) {
    for (const l of leaves) {
      const u = (t * l.sp * run + l.ph) % 1;
      l.g.setAttribute("transform", `translate(${n2(430 - u * 470)} ${n2(l.y + 26 * Math.sin(t * 1.8 + l.ph * 12))}) rotate(${n2(t * 150 * run + l.ph * 360)})`);
    }
  }
  if (show("heartFx", S.love)) {
    for (const h of hearts) {
      const u = (t * h.sp * run + h.ph) % 1;
      const s = h.sz * (0.7 + 0.9 * Math.sin(u * Math.PI));
      h.e.setAttribute("transform", `translate(${n2(h.x + 16 * Math.sin(t * 1.4 + h.ph * 14))} ${n2(400 - u * 330)}) scale(${n2(s)})`);
      h.e.setAttribute("opacity", n2(fade(u, 0.1, 0.75)));
    }
  }
}

// puffs and confetti run outside the mood state
function drawParticles(dt) {
  for (const p of puffs) {
    if (p.life <= 0) continue;
    p.life -= dt * 1.5;
    if (p.life <= 0) { p.e.setAttribute("opacity", 0); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - dt * 2.4; p.vy = p.vy * (1 - dt * 2.4) - 12 * dt;
    p.e.setAttribute("cx", n2(p.x)); p.e.setAttribute("cy", n2(p.y));
    p.e.setAttribute("r", n2(p.big * (0.5 + (1 - p.life) * 1.2))); p.e.setAttribute("opacity", n2(Math.min(1, p.life * 1.6)));
  }
  if (confettiLeft > 0) {
    confettiLeft -= dt;
    for (const c of confetti) {
      if (c.life <= 0) continue;
      c.x += (c.vx + 26 * Math.sin(c.y * 0.04)) * dt; c.y += c.vy * dt; c.r += c.vr * dt;
      if (c.y > 540) c.life = 0;
      c.e.setAttribute("transform", `translate(${n2(c.x)} ${n2(c.y)}) rotate(${n2(c.r)})`);
      c.e.setAttribute("opacity", c.life > 0 ? 1 : 0);
    }
    if (confettiLeft <= 0) confetti.forEach(c => c.e.setAttribute("opacity", 0));
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (!reduce) time += dt;
  tween(dt);
  draw(dt);
  drawParticles(dt);
  requestAnimationFrame(frame);
}

/* ----------------------------------- boot ----------------------------------- */
function start(data) {
  if (data.found) found = new Set(data.found.filter(id => BY_ID[id] && id !== "idle"));
  renderChips();
  renderMood(IDLE);
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.snapshot?.(() => ({ found: [...found] }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
